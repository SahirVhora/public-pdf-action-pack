[project]
name = "public-pdf-action-pack"
version = "0.1.0"
description = "Turn public-sector PDFs into plain-English actions, deadlines, and checklists."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pymupdf>=1.23",
  "requests>=2.31",
  "streamlit>=1.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "reportlab>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
